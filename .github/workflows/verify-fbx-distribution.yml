name: Verify FBX distribution candidate
on:
  push:
    branches: [codex/fbx-distribution]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Xenoah/meshcopia' && github.ref == 'refs/heads/codex/fbx-distribution'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prove anonymous browser CORS transport
        run: node scripts/probe-fbx-transport.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fbx-distribution-${{ github.sha }}
          path: test-results/
