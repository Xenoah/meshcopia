name: Verify, publish and release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meshcopia-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      source_only: ${{ steps.source-stage.outputs.source_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          architecture: x64
          cache: npm
      - name: Verify canonical archive runtime and immutable history
        run: |
          node scripts/check-archive-runtime.mjs
          node scripts/check-archive-lock.mjs --check-history
          node scripts/check-source-stage-proof.mjs
      - name: Determine source-only staging phase
        id: source-stage
        shell: bash
        run: |
          set -euo pipefail
          source_only="$(node scripts/check-source-stage.mjs)"
          case "$source_only" in true|false) ;; *) echo 'Invalid source-stage result' >&2; exit 1 ;; esac
          printf 'source_only=%s\n' "$source_only" >> "$GITHUB_OUTPUT"
      - name: Require exact main push for source-only stage
        if: steps.source-stage.outputs.source_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install -r scripts/requirements-assets.txt
      - name: Generate original starter assets (once)
        if: steps.source-stage.outputs.source_only == 'false'
        run: |
          if [ -f .bootstrap-starter ]; then
            python3 scripts/create-starter-assets.py
            rm .bootstrap-starter
          fi
      - name: Set up original cafe extraction (once)
        if: steps.source-stage.outputs.source_only == 'false' && hashFiles('.import-commons-cafe', '.import-commons-expansion') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract the pinned original cafe collection (once)
        if: steps.source-stage.outputs.source_only == 'false' && hashFiles('.import-commons-cafe') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libxi6 libxrender1 libxfixes3 libxkbcommon0 libxxf86vm1 libsm6
          python3 -m pip install bpy==4.5.14 numpy==1.26.4 Pillow==11.2.1
          python3 scripts/import-commons-cafe.py --fetch
          rm .import-commons-cafe
      - name: Import more original cafe meshes and textures (once)
        if: steps.source-stage.outputs.source_only == 'false' && hashFiles('.import-commons-expansion') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libxi6 libxrender1 libxfixes3 libxkbcommon0 libxxf86vm1 libsm6
          python3 -m pip install bpy==4.5.14 numpy==1.26.4 Pillow==11.2.1
          python3 scripts/import-commons-cafe.py --fetch --batch expansion
          python3 scripts/import-commons-textures.py
          rm .import-commons-expansion
      - name: Import reviewed original Yokocho assets (once)
        if: steps.source-stage.outputs.source_only == 'false' && hashFiles('.import-yokocho') != ''
        run: |
          python3 scripts/import-yokocho-source.py
          rm .import-yokocho
      - name: Set up original city draft generation (once)
        if: steps.source-stage.outputs.source_only == 'false' && hashFiles('.generate-city-drafts.json') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate original city drafts for review (once)
        if: steps.source-stage.outputs.source_only == 'false' && hashFiles('.generate-city-drafts.json') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libxi6 libxrender1 libxfixes3 libxkbcommon0 libxxf86vm1 libsm6
          python3 -m pip install bpy==4.5.14 numpy==1.26.4 Pillow==11.2.1
          python3 scripts/generate-city-drafts.py
      - name: Import inbox
        if: steps.source-stage.outputs.source_only == 'false'
        run: npm run import:all-inbox -- --apply
      - name: Verify durable minimal FBX proof and all public bytes
        run: python3 scripts/prepare-fbx-minimal-activation.py --repo "$GITHUB_WORKSPACE" --verification-mode durable-transport-attestation
      - name: Verify independent new-cohort proofs and anonymous bytes
        run: python3 scripts/prepare-cohort-activation.py --repo "$GITHUB_WORKSPACE"
      - name: Verify approved model revisions anonymously in this job
        run: python3 scripts/asset-revisions/prepare_activation.py
      - name: Validate, test and build
        run: npm run check
      - name: Verify texture maps, current delivery URLs and Pages budget
        run: |
          python3 scripts/check-textures.py
          node scripts/check-full-p-inputs.mjs --dist
          node scripts/check-fbx-minimal-baseline.mjs
          node scripts/measure-distribution.mjs
          node scripts/asset-revisions/validate.mjs
      - name: Install CI Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interactions and screenshots
        run: node scripts/test-browser.mjs
      - name: Verify ordinary selected downloads and exact displayed ZIP sizes
        run: node scripts/test-minimal-downloads-browser.mjs
      - name: Verify all FBX links and actual anonymous FBX downloads
        run: node scripts/test-fbx-minimal-downloads-browser.mjs
      - name: Verify revised previews, Japanese appliance searches and real mixed ZIPs
        run: node scripts/asset-revisions/test-review-browser.mjs --production
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: test-results/
      - name: Preserve city draft QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-draft-qa
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            docs/city-qa/
            .cache/city-drafts/
      - name: Verify source unchanged after QA
        env:
          SOURCE_ONLY: ${{ steps.source-stage.outputs.source_only }}
          SOURCE_HEAD: ${{ github.sha }}
        run: node scripts/check-source-stage-unchanged.mjs
      - name: Commit imported original assets
        if: steps.source-stage.outputs.source_only == 'false'
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/assets _inbox
          if [ -d docs/city-qa ]; then git add docs/city-qa; fi
          if git ls-files --error-unmatch .generate-city-drafts.json >/dev/null 2>&1; then git add -u .generate-city-drafts.json; fi
          if git ls-files --error-unmatch .bootstrap-starter >/dev/null 2>&1; then git add -u .bootstrap-starter; fi
          if git ls-files --error-unmatch .import-commons-cafe >/dev/null 2>&1; then git add -u .import-commons-cafe; fi
          if git ls-files --error-unmatch .import-commons-expansion >/dev/null 2>&1; then git add -u .import-commons-expansion; fi
          if git ls-files --error-unmatch .import-yokocho >/dev/null 2>&1; then git add -u .import-yokocho; fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat(assets): import validated original CC BY collection'
            auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
            unset auth
          fi
      - name: Record verified source SHA
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Build release archives
        if: steps.source-stage.outputs.source_only == 'false'
        run: npm run release:bundle
      - uses: actions/upload-artifact@v4
        if: steps.source-stage.outputs.source_only == 'false'
        with:
          name: release-packages
          path: release/
      - uses: actions/upload-pages-artifact@v3
        if: steps.source-stage.outputs.source_only == 'false'
        with:
          path: dist
  pages:
    needs: [verify, release]
    if: needs.verify.outputs.source_only == 'false'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    needs: verify
    if: needs.verify.outputs.source_only == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: browser-qa
          path: screenshots
      - name: Publish requested version once
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          node scripts/release.mjs
  verify-live:
    needs: [verify, pages]
    if: needs.verify.outputs.source_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download the exact deployed Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .cache/deployed-pages
      - name: Restore the verified deployment output
        run: |
          mkdir -p dist
          tar -xf .cache/deployed-pages/artifact.tar -C dist
      - name: Verify live catalog, capacity and anonymous same-origin chunks
        run: node scripts/check-live-pages.mjs
      - name: Verify live downloads, exact sizes, recovery and retired URLs
        run: node scripts/test-minimal-downloads-browser.mjs --live
      - name: Verify live FBX detail links and downloads
        run: node scripts/test-fbx-minimal-downloads-browser.mjs --live
      - name: Verify live previews and standalone textures
        run: node scripts/test-browser.mjs --live
      - name: Verify live repaired previews, appliance searches and actual mixed ZIPs
        run: node scripts/asset-revisions/test-review-browser.mjs --live
      - name: Preserve live Pages evidence
        if: always() && needs.verify.outputs.source_only == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-qa
          path: test-results/
